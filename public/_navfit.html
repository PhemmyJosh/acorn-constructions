<!doctype html><html><body style="margin:0"><pre id="out">…</pre><div id="f"></div>
<script>
const q=new URLSearchParams(location.search);
const w=parseInt(q.get('w')||'1024',10);
const f=document.createElement('iframe');
f.style.cssText='width:'+w+'px;height:400px;border:0;display:block';
f.src='/';
f.onload=()=>{setTimeout(()=>{
  const d=f.contentDocument;
  const header=d.querySelector('header');
  const logo=header.querySelector('img');
  const nav=header.querySelector('nav');
  const phone=header.querySelector('a[href^="tel:"]');
  const cta=[...header.querySelectorAll('a')].find(a=>a.textContent.trim()==='Get a Quote');
  const hr=header.getBoundingClientRect();
  const out=[];
  out.push('width='+w+' headerH='+Math.round(hr.height));
  out.push('logo   w='+Math.round(logo.getBoundingClientRect().width)+' h='+Math.round(logo.getBoundingClientRect().height));
  if(nav&&getComputedStyle(nav).display!=='none') out.push('nav    w='+Math.round(nav.getBoundingClientRect().width));
  if(phone){const r=phone.getBoundingClientRect();out.push('phone  w='+Math.round(r.width)+' h='+Math.round(r.height)+' lines='+Math.round(r.height/20));}
  if(cta){const r=cta.getBoundingClientRect();out.push('cta    w='+Math.round(r.width)+' h='+Math.round(r.height)+' href='+cta.getAttribute('href'));}
  out.push('overflowX='+(d.documentElement.scrollWidth-w));
  document.getElementById('out').textContent=out.join('\n');
},1500);};
document.getElementById('f').appendChild(f);
</script></body></html>
